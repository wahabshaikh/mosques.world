# One Worker Preview per pull request, on the preview D1/R2/KV (the `previews` block in
# wrangler.jsonc). The URL is posted on the PR and recorded as a GitHub deployment in the
# `preview` environment, so later jobs or workflows (E2E) can target it.
#
# Needs the CLOUDFLARE_API_TOKEN repository secret (Workers Scripts:Edit, D1:Edit). Fork and
# Dependabot PRs get no secrets, so they skip this workflow; CI still runs for them.
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions: {}

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
  WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN || 'wahabshaikh' }}

jobs:
  deploy:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    name: Deploy Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.preview.outputs.url }}
    outputs:
      url: ${{ steps.preview.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check Cloudflare credentials
        id: credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping the Preview deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.credentials.outputs.ready == 'true'
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        if: steps.credentials.outputs.ready == 'true'

      - name: Build
        if: steps.credentials.outputs.ready == 'true'
        run: pnpm build

      # All Previews share one database; migrations are additive, so applying a PR's new
      # migration early does not break other Previews.
      - name: Apply migrations to the preview database
        if: steps.credentials.outputs.ready == 'true'
        run: pnpm db:migrate:preview

      - name: Deploy Preview
        id: preview
        if: steps.credentials.outputs.ready == 'true'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base_url="https://${PREVIEW_NAME}-mosques-world.${WORKERS_SUBDOMAIN}.workers.dev"
          output="$(pnpm exec wrangler preview --name "$PREVIEW_NAME" --message "$HEAD_SHA" \
            --var "PUBLIC_BASE_URL:${base_url}" --json)"
          printf '%s\n' "$output"
          url="$(printf '%s' "$output" | jq -er '.preview.urls[0]')"
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        if: steps.credentials.outputs.ready == 'true'
        env:
          URL: ${{ steps.preview.outputs.url }}
        run: |
          for path in / /robots.txt /api/v1/openapi.json; do
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 -o /dev/null "$URL$path"
            echo "ok $path"
          done

      - name: Comment Preview URL
        if: steps.credentials.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.preview.outputs.url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body="**Preview:** ${URL} (commit ${HEAD_SHA:0:7}, preview database, emails go to the test sink)"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "$body"

  cleanup:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    name: Delete Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: env.CLOUDFLARE_API_TOKEN != ''
      - name: Delete Preview
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm exec wrangler preview delete --name "$PREVIEW_NAME" --skip-confirmation
